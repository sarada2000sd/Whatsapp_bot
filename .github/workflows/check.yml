name: REMOTE project checks
on:
  push:
    branches: ["remote-news", "main"]
  pull_request:
    branches: ["remote-news", "main"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
